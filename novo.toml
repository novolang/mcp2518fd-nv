[package]
name        = "mcp2518fd-nv"
version     = "0.1.0"
description = "A driver for Microchip's MCP2518FD external CAN FD controller on an SPI bus: embedded-hal-nv's CanBus for classic frames with the bit timing computed from the oscillator and the rate, and for FD frames with bit rate switching, the transmit queue and a transmit FIFO, the receive FIFO, the acceptance filters, the transmit event FIFO, the interrupt flags and the INT pin, the error counters and the GPIO pins, with the bring-up the data sheet and the reference manual ask for: the SPI clock limit before the oscillator is ready, the reset, the ECC enable and the RAM initialisation."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["mcp2518fd", "mcp2517fd", "can", "can-fd", "can-bus", "spi", "controller", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/mcp2518fd-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.1"

# Every module of the package checks at the embedded tier, so a program
# of any tier, embedded, rt or system, may call it.
[tier]
tier = "embedded"

# The device program, examples/can_fd_echo.nv, has no [[bin]] entry: an
# entry makes the registry list the package as a program, and a library
# with an entry would be built by `novo install` for the host.
# tests/device_build.sh builds the program for two boards as the main of
# a scratch package that depends on this one.

[docs.pages]
"README.md" = "Putting a CAN FD bus on an SPI port with an MCP2518FD"

[dependencies]
# The board's SPI bus, GPIO and timer handles, the SpiBus, GpioOut and
# Timer traits they implement, and the CanBus trait this driver implements.
embedded-hal-nv = "^0.3.3"
# The wiring record a board's device table hands `attach`.
devices-nv      = "^0.3.3"
# The CAN FD frame header, the DLC tables and the "nothing arrived" and
# "refused" values of a receive.
can-nv          = "^0.1.3"
